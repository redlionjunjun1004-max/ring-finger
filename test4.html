<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>입체파테스트(쉬움)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #f5f7fa; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #ffffff; width: 100%; max-width: 600px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 30px; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        .user-info { color: #3182ce; font-weight: bold; margin-bottom: 20px; background:#ebf8ff; padding: 8px; border-radius: 5px; display:inline-block; }
        
        /* 시험 문제 박스 스타일 */
        .quiz-box { background-color: #f8f9fa; border-left: 5px solid #2ecc71; padding: 20px; text-align: left; border-radius: 0 8px 8px 0; margin-bottom: 20px; }
        .quiz-box h3 { margin-bottom: 12px; color: #2d3748; }
        
        /* 이미지 스타일 */
        .quiz-img { display: block; max-width: 100%; height: auto; margin: 15px 0; border-radius: 6px; border: 1px solid #e2e8f0; }

        /* 주관식 입력창 스타일 */
        .input-text { width: 100%; padding: 10px; font-size: 1rem; border: 2px solid #cbd5e0; border-radius: 5px; margin-top: 10px; }
        .input-text:focus { border-color: #2ecc71; outline: none; }

        /* 버튼 스타일 */
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        .submit-btn { background-color: #2ecc71; color: white; border: none; padding: 12px 25px; font-size: 1rem; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .submit-btn:hover { background-color: #27ae60; }
        .back-btn { background-color: #e74c3c; color: white; text-decoration: none; padding: 12px 25px; font-size: 1rem; border-radius: 5px; text-align: center; line-height: 1.5; }
        .back-btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✍️ 입체파테스트(쉬움)</h1>
        <div class="user-info">응시자: <span id="user-name">Loading...</span> 님</div>

        <div class="quiz-box">
            <h3>Q1. 이 E.G.O의 이름은? (주관식)</h3>
            <img src="./4-1.png" alt="Q1 이미지" class="quiz-img">
            <input type="text" id="ans1" class="input-text" placeholder="정답을 입력하세요">
        </div>

        <div class="quiz-box">
            <h3>Q2. 이 E.G.O의 이름은? (주관식)</h3>
            <img src="./4-2.png" alt="Q2 이미지" class="quiz-img">
            <input type="text" id="ans2" class="input-text" placeholder="정답을 입력하세요">
        </div>

        <div class="btn-group">
            <button class="submit-btn" onclick="submitTest()">시험 제출 및 종료</button>
            <a href="index.html" class="back-btn">취소하고 돌아가기</a>
        </div>
    </div>

    <script>
        // 메인 화면에서 로그인한 실제 유저 닉네임과 시험 제목 가져오기
        const nickname = localStorage.getItem('currentNickname');
        const examTitle = localStorage.getItem('currentExamTitle') || '입체파(쉬움)시험';
        
        // 닉네임 데이터가 비어있으면 경고창을 띄우고 메인으로 추방
        if (!nickname || nickname.trim() === '') {
            alert('닉네임을 먼저 입력해야 시험에 응시할 수 있습니다!');
            window.location.href = 'index.html';
        } else {
            // 정상 유입 시 닉네임 표시
            document.getElementById('user-name').innerText = nickname;
        }

        function submitTest() {
            const answer1 = document.getElementById('ans1').value.trim();
            const answer2 = document.getElementById('ans2').value.trim();

            if (!answer1 || !answer2) {
                alert('모든 문제의 답을 입력해 주세요!');
                return; 
            }

            const now = new Date();
            // 포맷 오류 없이 깔끔하게 연월일 시분초 생성
            const timeString = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

            const logJsonFormat = {
                "userId": nickname,
                "examTitle": examTitle,
                "answer1": answer1,
                "answer2": answer2,
                "submittedAt": timeString
            };

            // 구글 웹 앱 URL 주소로 실시간 전송 (중앙 취합 서버)
  // 구글 웹 앱 URL 주소로 실시간 전송 (headers 항목을 지워 CSP 보안 차단을 우회합니다)
            fetch('https://script.google.com/macros/s/AKfycbx75hWKiU3RpiVqbNhWHV1YF2JPYhg5wAO2E6UYqglDjgLyWnMxttTaQvwl4vFKiFYS/exec', {
                method: 'POST',
                mode: 'no-cors', 
                body: JSON.stringify(logJsonFormat)
            })
            .then(() => {
                // 본인 브라우저 메인 화면 실시간 동기화를 위한 기록
                const existingLogs = JSON.parse(localStorage.getItem('log.json')) || [];
                existingLogs.push(logJsonFormat);
                localStorage.setItem('log.json', JSON.stringify(existingLogs));

                alert('시험 답안이 실시간으로 서버에 제출되었습니다!');
                window.location.href = 'index.html';
            })
            .catch(err => {
                alert('네트워크 오류가 발생했습니다.');
                console.error(err);
            });
        }
    </script>
</body>
</html>
