<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콘테스트</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: #f5f7fa; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #ffffff; width: 100%; max-width: 800px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 30px; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 15px; font-size: 2rem; }
        p { color: #666; margin-bottom: 25px; }
        
        /* 닉네임 입력창 스타일 */
        .nickname-box { background-color: #edf2f7; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
        .nickname-box label { font-weight: bold; display: block; margin-bottom: 10px; color: #4a5568; }
        .nickname-box input { padding: 10px; width: 250px; font-size: 1rem; border: 2px solid #cbd5e0; border-radius: 5px; text-align: center; }
        .nickname-box input:focus { border-color: #3498db; outline: none; }

        /* 시험 버튼 그리드 */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .test-link {
            display: block;
            background-color: #a0aec0; /* 기본은 비활성화 색상 */
            color: white;
            padding: 25px 15px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            pointer-events: none; /* 닉네임 입력 전엔 클릭 방지 */
            transition: transform 0.2s, background-color 0.2s;
        }
        /* 닉네임이 입력되면 클래스가 붙어서 활성화됨 */
        .test-link.active {
            background-color: #3498db;
            pointer-events: auto;
        }
        .test-link.active:hover { background-color: #2980b9; transform: translateY(-5px); }

        /* 기록 서랍 스타일 */
        .history-box { margin-top: 40px; text-align: left; border-top: 2px dashed #e2e8f0; padding-top: 25px; }
        .history-box h3 { color: #2d3748; margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; text-align: center; }
        th { background-color: #f7fafc; color: #4a5568; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝콘테스트</h1>
        <p>닉네임을 입력하신 후 응시할 시험을 선택해 주세요.</p>
        
        <!-- 닉네임 입력 영역 -->
        <div class="nickname-box">
            <label for="nickname">수험자 닉네임 입력</label>
            <input type="text" id="nickname" placeholder="닉네임을 적어주세요" oninput="checkNickname()">
        </div>

        <!-- 시험 링크 (초기에는 비활성화 상태) -->
        <div class="grid-container">
            <a href="test1.html" class="test-link" id="link1">1번 점묘파(쉬움)시험</a>
            <a href="test2.html" class="test-link" id="link2">2번 신체파(쉬움)시험</a>
            <a href="test3.html" class="test-link" id="link3">3번 야수파(쉬움)시험</a>
            <a href="test4.html" class="test-link" id="link4">4번 입체파(쉬움)시험</a>
            <a href="test5.html" class="test-link" id="link5">5번 절대파(쉬움)시험</a>
            <a href="test6.html" class="test-link" id="link6">6번 청기사파(쉬움)시험</a>
        </div>

        <!-- 시험 기록 테이블 -->
        <div class="history-box">
            <h3></h3>
            <table>
                <thead>
                    <tr>
                        <th>닉네임</th>
                        <th>응시 시험</th>
                        <th>제출 시간</th>
                    </tr>
                </thead>
                <tbody id="history-list">
                    <!-- 기록이 여기에 동적으로 추가됨 -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // 페이지가 로드될 때 기존에 입력했던 닉네임이 있다면 불러오고, 기록도 출력함
        window.onload = function() {
            const savedName = localStorage.getItem('currentNickname');
            if (savedName) {
                document.getElementById('nickname').value = savedName;
                checkNickname();
            }
            displayHistory();
        }

        // 닉네임이 입력되었는지 감시해서 버튼을 활성화/비활성화하는 함수
        function checkNickname() {
            const nameInput = document.getElementById('nickname').value.trim();
            const links = document.querySelectorAll('.test-link');
            
            if (nameInput.length > 0) {
                // 닉네임이 있으면 로컬스토리지에 임시 저장하고 버튼 활성화
                localStorage.setItem('currentNickname', nameInput);
                links.forEach(link => link.classList.add('active'));
            } else {
                // 없으면 버튼 비활성화
                localStorage.removeItem('currentNickname');
                links.forEach(link => link.classList.remove('active'));
            }
        }

        // 기록을 가져와서 테이블에 그려주는 함수
        function displayHistory() {
            const history = JSON.parse(localStorage.getItem('testHistory')) || [];
            const listObj = document.getElementById('history-list');
            listObj.innerHTML = ''; // 초기화

            if (history.length === 0) {
                listObj.innerHTML = `<tr><td colspan="3" style="color:#999;">아직 응시 기록이 없습니다.</td></tr>`;
                return;
            }

            // 최신 기록이 위로 오도록 역순 출력
            history.reverse().forEach(item => {
                const row = `<tr>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.testName}</td>
                    <td style="color:#718096; font-size:0.9rem;">${item.time}</td>
                </tr>`;
                listObj.innerHTML += row;
            });
        }
    </script>
</body>
</html>
